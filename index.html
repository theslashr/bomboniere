<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prova rilievo bomboniere</title>
<style>
  :root{
    --ink:#0E2438; --wall:#16181d; --wall-2:#0c0d10;
    --canvas:#F4EFE6; --muted:#8b8f96; --dim:#666a71; --ochre:#D9A227;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
    /* the same above the picture as below it, so centring reads as centred */
    --breathe:clamp(.9rem,2.2vw,1.5rem);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  /* A class that sets display beats the UA's [hidden]{display:none}, so the
     sheet stayed laid out while "hidden": invisible at opacity 0, but covering
     the viewport at z-index 60 and swallowing every pointer event. Hover on
     the painting died and only the arrow keys, bound to document, still
     worked. Not negotiable, hence the !important. */
  [hidden]{ display:none!important; }
  body{
    margin:0; min-height:100svh;
    background:radial-gradient(130% 95% at 50% 0%, var(--wall) 0%, var(--wall-2) 72%);
    color:var(--canvas); font-family:var(--sans); font-weight:350; font-size:15px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(1.2rem,3vw,2.4rem);
    -webkit-font-smoothing:antialiased;
  }
  /* The only heading left is the one in the sheet's header, which inherits
     that bar's type rather than setting its own. */
  h1{ margin:0; font:inherit; letter-spacing:inherit; }
  /* The hint has a job exactly once. It floats under the painting rather than
     taking a row of its own, and retires the moment the hand arrives - so it
     costs no height, and the gap it used to leave behind goes with it. */
  .sub{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    margin:0; padding:2.2rem .8rem .7rem;
    color:rgba(244,239,230,.92); font-size:.68rem; letter-spacing:.12em;
    text-transform:uppercase; text-align:center; line-height:1.4;
    pointer-events:none;
    /* a scrim, because it has to be readable over whichever painting it
       happens to land on */
    background:linear-gradient(to top, rgba(6,8,11,.78), rgba(6,8,11,0));
    transition:opacity .6s var(--ease);
  }
  .sub.gone{ opacity:0; }

  .stage{
    position:relative;
    perspective:1200px; width:100%; max-width:1000px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    min-height:0;
    touch-action:none;
  }
  .plate{
    position:relative; border-radius:2px; overflow:hidden;
    transform-style:preserve-3d;
    transition:transform .18s var(--ease), box-shadow .4s var(--ease), opacity .34s var(--ease);
    box-shadow:0 34px 60px -26px rgba(0,0,0,.85), 0 6px 16px -8px rgba(0,0,0,.6);
    cursor:grab; max-width:100%;
  }
  .plate:active{ cursor:grabbing; }
  .plate.busy{ opacity:0; }
  /* Take the room that is actually going spare. The second term is what the
     rest of the page needs - title, edition, rail, button, padding - so the
     picture grows with the window instead of sitting at a fixed 620px with the
     slack turning into margin. */
  .plate canvas{
    display:block; max-width:100%;
    max-height:min(74svh, calc(100svh - 364px));
    width:auto; height:auto;
  }
  .plate::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    box-shadow:inset 0 0 0 1px rgba(255,252,244,.10); border-radius:inherit;
  }

  /* ---------- cursor, the same one the painter site uses ----------
     difference blending is what makes one cursor read on both a near-black
     wall and a bright painting without ever changing colour. */
  .brush-cursor{
    position:fixed; top:0; left:0; z-index:120;
    pointer-events:none; opacity:0;
    transform:translate(-50%,-50%);
    transition:opacity .3s;
    mix-blend-mode:difference;
  }
  .brush-cursor svg{ display:block; overflow:visible; }
  .brush-dot{
    position:fixed; top:0; left:0; z-index:121;
    pointer-events:none; opacity:0;
    transform:translate(-50%,-50%);
    transition:opacity .3s;
    mix-blend-mode:difference;
  }
  .brush-dot svg{ display:block; }
  .bc-ring{
    fill:none; stroke:#fff; stroke-width:1.25; opacity:.65;
    transform-origin:center; transition:transform .3s var(--ease);
  }
  .bc-dot{ fill:#fff; }
  body.has-cursor .brush-cursor,
  body.has-cursor .brush-dot{ opacity:1; }
  body.has-cursor .brush-cursor.on svg{ transform:scale(1.7); }

  @media (hover:hover) and (pointer:fine){
    body.has-cursor,
    body.has-cursor a,
    body.has-cursor button,
    body.has-cursor .plate{ cursor:none; }
  }

  /* ---------- the wash the grid picks up as it scrolls ---------- */
  /* Light falls on whole paintings, not through a hole in a sheet of glass.
     A mask over a backdrop-filter was the obvious way and it did not work:
     mask-composite:intersect would not punch the extra holes, so every point
     came back within a few percent of every other and there was no falloff at
     all. Per-painting also reads better - a picture is lit or it is not,
     rather than a circle cutting across three of them. */
  .sheet__grid button{
    --lit:0;
    /* Lit goes past normal rather than back to it: saturation alone is a weak
       cue, and a card that only stops being dim does not read as anything
       passing over it. Brightness is what makes a wave visible. */
    filter:saturate(calc(.58 + .62 * var(--lit))) brightness(calc(.93 + .19 * var(--lit)));
  }

  /* ---------- edition mark ---------- */
  .edition{
    /* centred, not baseline: the number is 2.15rem and the rest under .9rem,
       so a shared baseline left them visibly stepped against each other */
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    margin:var(--breathe) 0 0;
    font-variant-numeric:tabular-nums; line-height:1;
    opacity:0; transform:translateY(4px);
    transition:opacity .5s var(--ease), transform .5s var(--ease);
  }
  .edition.in{ opacity:1; transform:none; }
  .edition .n{
    font-size:clamp(1.5rem,3.4vw,2.15rem); font-weight:300;
    letter-spacing:.02em; color:var(--canvas);
  }
  .edition .sep{ font-size:1rem; color:#4a4e55; font-weight:300; }
  .edition .tot{ font-size:.82rem; color:var(--muted); letter-spacing:.13em; }
  .edition .uniq{
    margin-left:.4rem; padding-left:.8rem; font-size:.62rem; letter-spacing:.18em;
    text-transform:uppercase; color:#5f646b; border-left:1px solid rgba(255,255,255,.13);
    line-height:1.6;
  }

  /* ---------- the reel ----------
     Ported from a React/Framer component rather than dropped in: this page is
     one static file with no build step, and a toolchain for one carousel would
     be a poor trade. The maths is the whole idea anyway - a card sits at
     theta = i*step + rotation on an ellipse, and cos(theta) places it, sizes
     it and stacks it. One number driving all three is why a card that looks
     nearer is nearer, and the stacking can never disagree with the
     perspective.

     The ellipse is centred on the left edge, so the far half is clipped away
     and what is left is an arc bulging toward the painting. */
  /* A flex pair rather than a grid: the grid gave the painting a 1fr column
     and it centred inside it, which put 300px of nothing between the arc and
     the picture. Sized to content and centred together, they stay adjacent at
     any width. */
  /* With a painting whose width changes, you cannot have the arc fixed, the
     composition centred and the gap constant all at once. Centring the pair
     let the painting's width slide the arc sideways; anchoring the pair left
     kept the arc still but left half the screen empty. So the painting gets a
     box of its own, constant width, and the pair is centred: the arc never
     moves, the composition stays balanced, and what gives is the gap - tight
     for a wide painting, moderate for a narrow one. */
  .viewer{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(.4rem,1.2vw,1.1rem);
    width:100%;
  }
  .reel{
    position:relative; overflow:hidden;
    flex:0 0 auto; width:clamp(190px,21vw,300px);
    height:min(74svh,720px);
    cursor:grab; touch-action:pan-y;
    outline:none;
    /* Two fades, not one. The vertical was always here so the ends of the arc
       fall away instead of being sliced. But the ellipse is centred on the
       box's left edge, which is mid-page, so every card was also cut in half
       down a hard vertical line - a seam the eye reads as a mistake. The
       second gradient dissolves that half instead of cutting it. */
    -webkit-mask-image:
      linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent),
      linear-gradient(to right, transparent, rgba(0,0,0,.55) 12%, #000 34%);
    mask-image:
      linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent),
      linear-gradient(to right, transparent, rgba(0,0,0,.55) 12%, #000 34%);
    -webkit-mask-composite:source-in;
    mask-composite:intersect;
  }
  .reel:active{ cursor:grabbing; }
  .reel button{
    position:absolute; left:0; top:50%;
    padding:0; border:0; background:none; cursor:pointer;
    line-height:0; border-radius:2px; overflow:hidden;
    will-change:transform;
    box-shadow:0 16px 30px -14px rgba(0,0,0,.85);
  }
  .reel img{ display:block; width:100%; height:100%; object-fit:cover; }
  .reel button::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,252,244,.14);
    transition:box-shadow .35s var(--ease);
  }
  .reel button[aria-current="true"]::after{ box-shadow:inset 0 0 0 2px var(--ochre); }
  .show{
    display:flex; flex-direction:column; align-items:center;
    flex:0 0 auto; width:min(48vw,720px);
  }
  .show .stage{ justify-content:center; width:100%; max-width:none; }
  .show .edition{ justify-content:center; }

  /* ---------- rail ---------- */
  .strip{
    display:flex; gap:.55rem; align-items:center;
    width:max-content; max-width:100%;
    margin:var(--breathe) auto 0;
    overflow-x:auto; overflow-y:hidden;
    padding:.5rem .9rem .5rem;
    scrollbar-width:none;
    /* the ends fall away rather than being sliced off mid-thumbnail */
    -webkit-mask-image:linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
    mask-image:linear-gradient(to right, transparent, #000 34px, #000 calc(100% - 34px), transparent);
  }
  .strip::-webkit-scrollbar{ display:none; }
  .strip button{
    flex:0 0 auto; padding:0; border:0; background:none; cursor:pointer;
    border-radius:2px; line-height:0; position:relative;
    opacity:.5; filter:saturate(.7); transform:scale(.92);
    transition:opacity .45s var(--ease), transform .45s var(--ease),
               filter .45s var(--ease), box-shadow .45s var(--ease);
  }
  .strip button:hover{ opacity:.85; filter:saturate(.95); transform:scale(.97); }
  .strip button[aria-current="true"]{
    opacity:1; filter:none; transform:scale(1.1);
    box-shadow:0 12px 22px -10px rgba(0,0,0,.9);
  }
  /* a hairline only the current one wears */
  .strip button::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,252,244,.16);
    opacity:0; transition:opacity .45s var(--ease);
  }
  .strip button[aria-current="true"]::after{ opacity:1; box-shadow:inset 0 0 0 1px var(--ochre); }
  .strip img{ display:block; height:clamp(54px,7.4vw,76px); width:auto; border-radius:2px; }

  /* After the rules they override, not before: equal specificity means source
     order decides, and above the rail block these did nothing at all.

     The arc does not come to the phone. Rotating it a quarter turn along the
     bottom was tried and is the wrong shape for the screen: the band it can
     have is about 140px tall, which leaves cards under 90px and an ellipse
     whose depth axis is longer than the band, so the back of the ring lands
     outside the box in the room the edition mark and the button are using.
     Portrait and landscape paintings then move that band by different amounts
     and the whole column shifts under you. The rail is flat by nature and
     scrolls with the thumb, so mobile keeps the rail. */
  @media (max-width:900px){
    .viewer{ display:block; width:100%; }
    .show{ width:100%; }
    .show .stage{ justify-content:center; }
    .show .edition{ justify-content:center; }
    .reel{ display:none; }
  }
  @media (min-width:901px){
    .strip{ display:none; }
  }

  /* ---------- controls ---------- */
  .panel{ margin-top:1rem; width:min(100%,540px); display:grid; gap:.7rem; font-size:.76rem; color:var(--muted); }
  .row{ display:grid; grid-template-columns:7.5rem 1fr 2.8rem; align-items:center; gap:.7rem; }
  input[type=range]{ width:100%; accent-color:var(--ochre); }
  .val{ font-variant-numeric:tabular-nums; text-align:right; color:var(--canvas); }
  .btns{ display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.15rem; }
  button.pill{
    font:inherit; font-size:.76rem; color:var(--canvas);
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    border-radius:100px; padding:.45rem .95rem; cursor:pointer;
  }
  button.pill:hover{ background:rgba(255,255,255,.12); }
  button.pill[aria-pressed="true"]{ background:var(--ochre); color:var(--ink); border-color:var(--ochre); }
  button.pill[hidden]{ display:none; }
  .seg{ display:flex; gap:0; border:1px solid rgba(255,255,255,.16); border-radius:100px; overflow:hidden; }
  .seg button{
    font:inherit; font-size:.76rem; color:var(--canvas); background:none; border:0;
    padding:.45rem .95rem; cursor:pointer;
  }
  .seg button[aria-pressed="true"]{ background:var(--ochre); color:var(--ink); }

  .err{ color:#e08b7a; }

  /* The sheet has its own scroller. Without this the page behind keeps its
     own, and the grid shows two vertical scrollbars. */
  body.sheet-open{ overflow:hidden; }

  /* ---------- everything, on demand ---------- */
  .allBtn{
    display:block; margin:var(--breathe) auto 0;
    font:inherit; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); background:none; border:0; cursor:pointer;
    padding:.4rem .2rem; transition:color .3s var(--ease);
  }
  .allBtn:hover{ color:var(--canvas); }

  /* Solid, with no backdrop-filter. It is the page now rather than something
     laid over one, and a screen-blended layer above a filtered backdrop is
     exactly what turned the other project's hero black. */
  .sheet{
    position:fixed; inset:0; z-index:60;
    background:var(--wall-2);
    display:flex; flex-direction:column;
    opacity:0; transition:opacity .3s var(--ease);
  }
  .sheet.in{ opacity:1; }
  .sheet__head{
    display:flex; align-items:center; justify-content:space-between;
    padding:clamp(.9rem,3vw,1.5rem) clamp(1rem,4vw,2.4rem);
    font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid rgba(255,255,255,.07); flex:0 0 auto;
  }
  .sheet__head button{
    font:inherit; font-size:1.5rem; line-height:1; letter-spacing:0;
    color:var(--muted); background:none; border:0; cursor:pointer; padding:0 .2rem;
  }
  .sheet__head button:hover{ color:var(--canvas); }
  /* Columns, not grid. These thumbnails are a mix of portrait and landscape,
     and grid has to size a row track before it can place anything in it: an
     image at width:100% contributes no height to that pass, because the
     percentage cannot resolve while the track it depends on is still being
     sized, so every row collapsed to a 34px sliver and the pictures spilled
     out of buttons that clipped them. Columns have no track step at all - the
     column width is definite up front - and they give a masonry flow, which
     suits a set of mixed shapes better than a ragged grid would. */
  /* The scroller has to be the wrapper, not the columns. A multi-column box
     with a fixed height does not grow downward: it makes more columns and
     overflows sideways, so overflow-y had nothing to scroll and the far
     columns were simply cut off. Given auto height it balances and grows, and
     the wrapper scrolls it. */
  .sheet__scroll{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    position:relative; z-index:2;
  }
  .sheet__grid{
    column-width:clamp(78px,11vw,124px);
    column-gap:clamp(.5rem,1.4vw,.85rem);
    padding:clamp(1rem,3vw,1.8rem) clamp(1rem,4vw,2.4rem) clamp(2rem,5vw,3rem);
  }
  /* display:block, because a button with line-height:0 collapses to no height
     and then clips its own contents away.

     The aspect-ratio is set per button from the thumbnail's real proportions,
     and it is what makes the rows size correctly. An image at width:100% with
     height:auto contributes no height during the grid's intrinsic row pass -
     the percentage cannot resolve while the track it depends on is still being
     sized - so every row collapsed to a 34px sliver and the pictures spilled
     out of buttons that clipped them. A ratio on the item resolves against the
     column, which is already definite by then. */
  .sheet__grid button{
    display:block; width:100%; position:relative;
    margin:0 0 clamp(.5rem,1.4vw,.85rem);
    break-inside:avoid; -webkit-column-break-inside:avoid;
    padding:0; border:0; background:none;
    cursor:pointer; line-height:0; border-radius:2px; overflow:hidden;
    opacity:.82; transition:opacity .25s var(--ease), transform .25s var(--ease);
  }
  .sheet__grid button:hover{ opacity:1; transform:translateY(-2px); }
  .sheet__grid button[aria-current="true"]{ outline:2px solid var(--ochre); outline-offset:1px; }
  /* Each keeps its own shape: the button carries that painting's ratio, so
     cover fills it exactly and crops nothing. A fixed box would cut the
     landscape ones hard, and cropping the composition is a poor way to ask
     someone to choose. */
  .sheet__grid img{ display:block; width:100%; height:auto; }
  .sheet__grid b{
    position:absolute; left:0; right:0; bottom:0;
    font-size:.58rem; font-weight:400; letter-spacing:.08em; line-height:1;
    padding:.42rem .3rem .3rem; color:var(--canvas);
    background:linear-gradient(to top, rgba(0,0,0,.72), transparent);
    font-variant-numeric:tabular-nums;
  }

  /* The stage refuses to scroll the page, because a drag across it is aiming
     the light. So on a short screen everything has to fit, or the biggest
     region on the display becomes the one place a swipe does nothing. */
  @media (max-height:760px){
    .plate canvas{ max-height:min(58svh, calc(100svh - 322px)); }
    .edition{ margin-top:.85rem; }
  }
  kbd{ font:inherit; background:rgba(255,255,255,.09); border-radius:3px; padding:0 .3em; }
</style>
</head>
<body>

<div class="brush-cursor" id="brushCursor" aria-hidden="true">
  <svg viewBox="0 0 40 40" width="40" height="40">
    <circle class="bc-ring" cx="20" cy="20" r="14"/>
  </svg>
</div>
<div class="brush-dot" id="brushDot" aria-hidden="true">
  <svg viewBox="0 0 12 12" width="12" height="12">
    <circle class="bc-dot" cx="6" cy="6" r="3.5"/>
  </svg>
</div>

<div class="viewer">
  <div class="reel" id="reel" tabindex="0" role="listbox" aria-label="Scegli un quadro"></div>

  <div class="show">
    <div class="stage" id="stage">
      <div class="plate" id="plate">
        <canvas id="gl"></canvas>
        <p class="sub" id="sub">Muovi il puntatore sul quadro</p>
      </div>
    </div>

    <div class="edition" id="edition" aria-live="polite">
      <span class="n"  id="edNum">—</span>
      <span class="sep">/</span>
      <span class="tot" id="edTot">126</span>
      <span class="uniq">pezzo unico</span>
    </div>
  </div>
</div>

<div class="strip" id="strip"></div>
<button class="allBtn" id="allBtn" type="button" id="allBtnLabel">Vedi tutte le 126</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__head">
    <h1 id="sheetTitle">Prova rilievo bomboniere · 126 pezzi unici</h1>
    <button id="sheetClose" type="button" aria-label="Chiudi">&times;</button>
  </div>
  <div class="sheet__scroll" id="sheetScroll">
    <div class="sheet__grid" id="sheetGrid"></div>
  </div>
</div>

<p class="err" id="err" hidden></p>

<script>
(function () {
  'use strict';

  /* The whole set. Files are named by their place in it, n001..n126, from
     sorting the export by batch and then by number within it. The file name is
     the edition number, so there is no table to keep in step. */
  var TOTAL = 126;
  var ART = [];
  for (var k = 1; k <= TOTAL; k++) {
    ART.push('n' + (k < 10 ? '00' : k < 100 ? '0' : '') + k);
  }

  /* Each cached painting holds a normal map canvas and its decoded source,
     about 8MB the pair at this size. Unbounded that is a gigabyte across 126
     and a dead tab on a phone, so only the last few are kept. */
  var CACHE_MAX = 6;

  /* Thumbnail sizes, so the browser reserves the right box before an image
     arrives. Without them a lazily loaded thumbnail has no intrinsic size at
     layout time, the grid sizes its rows to nothing, and the pictures then
     overflow buttons that clip them: 126 paintings sliced into ribbons. */
  var TW = 220;
  var TH = [
    144,332,146,327,333,336,329,334,337,330,326,327,332,145,321,143,327,335,339,145,333,
    338,329,332,330,331,332,331,334,328,334,147,331,148,154,331,149,335,332,337,338,332,
    332,328,332,328,145,327,336,346,341,348,344,341,332,327,340,335,331,329,332,320,324,
    338,332,333,332,336,343,332,327,335,336,342,333,142,344,329,340,336,338,332,336,339,
    336,330,336,332,344,339,327,333,145,332,145,331,332,326,147,333,324,327,331,332,334,
    338,144,336,331,146,148,330,329,145,144,331,339,144,325,335,334,335,330,341,336,331
  ];

  var cv = document.getElementById('gl');
  var plate = document.getElementById('plate');
  var stage = document.getElementById('stage');
  var strip = document.getElementById('strip');
  var err  = document.getElementById('err');
  var edition = document.getElementById('edition');
  var edNum   = document.getElementById('edNum');
  document.getElementById('edTot').textContent = String(TOTAL);
  document.getElementById('allBtn').textContent = 'Vedi tutte le ' + TOTAL;
  document.getElementById('sheetTitle').textContent = 'Prova rilievo bomboniere · ' + TOTAL + ' pezzi unici';

  function fail(msg) { err.hidden = false; err.textContent = msg; }

  var gl = cv.getContext('webgl', { alpha: false, antialias: false })
        || cv.getContext('experimental-webgl', { alpha: false, antialias: false });
  if (!gl) { fail('WebGL non disponibile in questo browser.'); return; }

  /* ------------------------------------------------------------------
     Relief comes off the photograph itself, once per painting, on the
     CPU. Doing the high pass in the shader would cost about twenty
     texture reads a pixel every frame; baking a normal map leaves the
     draw loop with two. Results are cached, so revisiting is instant.
     ------------------------------------------------------------------ */
  var cache = {}, cacheOrder = [];

  function remember(name, nm) {
    cache[name] = nm;
    cacheOrder.push(name);
    while (cacheOrder.length > CACHE_MAX) {
      var old = cacheOrder.shift();
      if (old === name || !cache[old]) continue;
      // shrink the backing store as well as dropping the reference, or the
      // canvas memory can outlive the object for a while
      cache[old].canvas.width = cache[old].canvas.height = 1;
      delete cache[old];
    }
  }

  function touch(name) {
    var at = cacheOrder.indexOf(name);
    if (at !== -1) { cacheOrder.splice(at, 1); cacheOrder.push(name); }
  }

  function buildNormalMap(img) {
    var MAXW = 1400;
    var w = Math.min(img.naturalWidth, MAXW);
    var h = Math.round(img.naturalHeight * (w / img.naturalWidth));

    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    var src = ctx.getImageData(0, 0, w, h).data;

    var n = w * h, i, x, y, k;
    var lum = new Float32Array(n);
    for (i = 0; i < n; i++) {
      lum[i] = 0.299 * src[i * 4] + 0.587 * src[i * 4 + 1] + 0.114 * src[i * 4 + 2];
    }

    /* Running-sum box blur: O(n) rather than O(n*r), because the naive
       version was most of the load time on a 1280px photograph. */
    function box(sIn, r) {
      var win = r * 2 + 1, t = new Float32Array(n), res = new Float32Array(n), xx, yy, kk, run;
      for (yy = 0; yy < h; yy++) {
        var row = yy * w; run = 0;
        for (kk = 0; kk <= r; kk++) run += sIn[row + Math.min(kk, w - 1)];
        for (xx = 0; xx < w; xx++) {
          t[row + xx] = run / Math.min(win, w);
          var a1 = xx + r + 1, s1 = xx - r;
          if (a1 < w) run += sIn[row + a1];
          if (s1 >= 0) run -= sIn[row + s1];
        }
      }
      for (xx = 0; xx < w; xx++) {
        run = 0;
        for (kk = 0; kk <= r; kk++) run += t[Math.min(kk, h - 1) * w + xx];
        for (yy = 0; yy < h; yy++) {
          res[yy * w + xx] = run / Math.min(win, h);
          var a2 = yy + r + 1, s2 = yy - r;
          if (a2 < h) run += t[a2 * w + xx];
          if (s2 >= 0) run -= t[s2 * w + xx];
        }
      }
      return res;
    }

    /* A band pass, not a high pass. Subtracting only the blur keeps every
       frequency above the cutoff, and at 1280px the top of that band is JPEG
       noise rather than canvas: it came through as red-green speckle in the
       normal map and as sparkle on the lit surface. The weave is roughly
       2-4px here, so blurring by a single pixel first drops the noise and
       leaves the cloth. */
    var low  = box(lum, 3);
    var fine = box(lum, 1);

    var hp = new Float32Array(n);
    var NOISE = 0.8 / 255;
    for (i = 0; i < n; i++) {
      var d = (fine[i] - low[i]) / 255;
      var m = Math.abs(d);
      hp[i] = m < NOISE ? 0 : (d > 0 ? m - NOISE : -(m - NOISE));
    }

    var out = ctx.createImageData(w, h);
    var o2 = out.data;
    function at(xx, yy) {
      if (xx < 0) xx = 0; else if (xx >= w) xx = w - 1;
      if (yy < 0) yy = 0; else if (yy >= h) yy = h - 1;
      return hp[yy * w + xx];
    }
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        var gx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1))
               - (at(x - 1, y - 1) + 2 * at(x - 1, y) + at(x - 1, y + 1));
        var gy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1))
               - (at(x - 1, y - 1) + 2 * at(x, y - 1) + at(x + 1, y - 1));
        var nx = -gx, ny = -gy, nz = 0.28;
        var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
        var p = (y * w + x) * 4;
        o2[p]     = Math.round((nx / len * 0.5 + 0.5) * 255);
        o2[p + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
        o2[p + 2] = Math.round((nz / len * 0.5 + 0.5) * 255);
        o2[p + 3] = 255;
      }
    }
    var nc = document.createElement('canvas');
    nc.width = w; nc.height = h;
    nc.getContext('2d').putImageData(out, 0, 0);

    return { canvas: nc, w: w, h: h };
  }

  /* ---------------- shaders ---------------- */
  var VS = [
    'attribute vec2 a;',
    'varying vec2 v;',
    'void main(){ v = vec2(a.x, 1.0 - a.y); gl_Position = vec4(a * 2.0 - 1.0, 0.0, 1.0); }'

    'precision mediump float;',
    'varying vec2 v;',
    'uniform sampler2D uCol;',
    'uniform sampler2D uNrm;',
    'uniform vec3  uLight;',
    'uniform float uRelief;',
    'uniform float uGloss;',
    'uniform float uSpec;',
    'void main(){',
    '  vec3 base = texture2D(uCol, v).rgb;',
    '  vec3 nm = texture2D(uNrm, v).rgb;',
    '  vec3 N = normalize(vec3((nm.xy * 2.0 - 1.0) * uRelief, nm.z * 2.0 - 1.0));',
    '  vec3 L = normalize(uLight);',
    '  vec3 V = vec3(0.0, 0.0, 1.0);',
    '  vec3 H = normalize(L + V);',
    '  float ndl = max(dot(N, L), 0.0);',
    '  float spec = pow(max(dot(N, H), 0.0), uGloss) * uSpec;',
    '  vec2 lp = vec2(0.5) + uLight.xy * 0.42;',
    '  float sheen = smoothstep(0.85, 0.0, distance(v, lp)) * 0.10 * uSpec;',
    '  vec3 col = base * (0.90 + 0.22 * ndl) + vec3(spec) + vec3(sheen);',

  var U = {
    light:  gl.getUniformLocation(prog, 'uLight'),
    relief: gl.getUniformLocation(prog, 'uRelief'),
    gloss:  gl.getUniformLocation(prog, 'uGloss'),
    spec:   gl.getUniformLocation(prog, 'uSpec')

  gl.uniform1i(gl.getUniformLocation(prog, 'uCol'), 0);
  gl.uniform1i(gl.getUniformLocation(prog, 'uNrm'), 1);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  }

  /* ---------------- state ---------------- */
  var lx = 0.25, ly = 0.35, tlx = lx, tly = ly;
  /* Settled by eye across the whole set rather than on any one painting. A
     tight, dim highlight reads as thread catching light; a broad bright one
     reads as plastic. tuning.html is the same viewer with the sliders back. */
  var RELIEF = 3.2, GLOSS = 91.0, SPEC = 0.52, TILT = 4.3;

  var LIGHT_Z = 0.85;

  /* A phone shows the picture far smaller, so the same movement reads as far
     less of one. A fifth more makes up for it, and both halves have to take it
     or the plate swings further while the light carries on as before, which
     looks like tilting something and having nothing happen.

     tan(angle) = |xy| / z, so dividing z is exactly scaling x and y, and it
     leaves the clamp on the aim still meaning what it meant. */
  if (matchMedia('(hover: none)').matches) {
    var BOOST = 1.45;
    TILT *= BOOST;

  }
  var current = -1, ready = false;
  var hashArt = -1, hashAll = 0;

  (function () {   // #lx=..&ly=..&t=.. parks a setup, for links and screenshots
    var h = location.hash.replace('#', ''); if (!h) return;
    h.split('&').forEach(function (kv) {
      var p = kv.split('='), n = parseFloat(p[1]); if (isNaN(n)) return;
      if (p[0] === 'lx') lx = tlx = n;
      if (p[0] === 'ly') ly = tly = n;

      if (p[0] === 'all') hashAll = 1;
    });
  })();

  /* The light is normalised to the picture, so edge to edge across it gives
     only +-1. The rest of the range used to come from the margin of stage
     around the picture, which on a phone is zero: the plate fills the stage,
     so the effect capped at 1.0 there against 1.2-1.4 on a desktop. The gain
     makes a drag across the picture itself cover the whole range, so it
     behaves the same however much room happens to surround it. */
  var AIM_GAIN = 1.4;

  function aim(e) {
    var r = plate.getBoundingClientRect();
    var nx = (((e.clientX - r.left) / r.width) * 2 - 1) * AIM_GAIN;
    var ny = (((e.clientY - r.top) / r.height) * 2 - 1) * AIM_GAIN;

    tly = Math.max(-1.4, Math.min(1.4, ny));

  if (window.DeviceOrientationEvent &&

    window.addEventListener('deviceorientation', function (e) {
      if (e.gamma == null || e.beta == null) return;

      tly = Math.max(-1.4, Math.min(1.4, (e.beta - 45) / 32));

  }
  if (matchMedia('(hover: none)').matches) {
    document.getElementById('sub').textContent = 'Trascina il dito sul quadro';
  }

  // it has said its piece once the hand arrives
  stage.addEventListener('pointermove', function () { sub.classList.add('gone'); }, { once: true });
  stage.addEventListener('pointermove', aim);
  stage.addEventListener('pointerdown', aim);

  /* ---------------- filmstrip + loading ---------------- */
  ART.forEach(function (name, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Quadro ' + (i + 1));
    b.setAttribute('aria-current', 'false');
    var t = document.createElement('img');
    t.src = 'img/thumb/' + name + '.jpg';
    t.alt = '';
    t.loading = 'lazy';
    t.width = TW; t.height = TH[i];
    b.appendChild(t);
    b.addEventListener('click', function () { select(i); });
    strip.appendChild(b);
  });
  var stripBtns = strip.querySelectorAll('button');

  function markStrip(i) {
    stripBtns.forEach(function (b, j) {
      var on = i === j;
      b.setAttribute('aria-current', String(on));

      }

  }

  function setEdition(i) {
    var n = i + 1;
    edNum.textContent = n < 10 ? '0' + n : String(n);
    edition.classList.remove('in');
    // let the removal land before adding it back, so the mark plays again
    setTimeout(function () { edition.classList.add('in'); }, 30);
  }

  function select(i) {
    if (i === current) return;
    current = i;
    markStrip(i);
    setEdition(i);
    syncReel(i);

    var name = ART[i];
    var warm = !!cache[name];
    plate.classList.add('busy');          // fade the picture out first

    /* Wait for the fade before the build, which blocks the thread for the best
       part of a second: starting it early would freeze the fade halfway. A
       timer, not rAF, because rAF stops in a background tab and the load would
       sit there until the tab came forward again. */
    setTimeout(function () {
      if (cache[name]) { touch(name); apply(cache[name]); return; }
      var img = new Image();
      img.onload = function () {
        setTimeout(function () {
          var nm = buildNormalMap(img);
          nm.img = img;
          remember(name, nm);
          apply(nm);
        }, 16);
      };
      img.onerror = function () {
        plate.classList.remove('busy');

      };
      img.src = 'img/full/' + name + '.jpg';
    }, warm ? 200 : 340);
  }

  function syncReel(i) {
    if (!reelCards || !reelCards.length || dragging) return;
    if (wrapIdx(Math.round(posTarget)) === i) return;
    spinTo(i);
  }

  function apply(nm) {
    cv.width = nm.w; cv.height = nm.h;
    gl.viewport(0, 0, nm.w, nm.h);
    upload(texCol, 0, nm.img);
    upload(texNrm, 1, nm.canvas);
    plate.classList.remove('busy');
    ready = true;
  }

  /* ---------------- all of them, on demand ----------------
     126 thumbnails in the rail is a long scroll to reach anything in
     particular, so the rail stays for browsing what is nearby and this is for
     going somewhere. Built on first open rather than at load, so the grid
     costs nothing until it is wanted. */
  var sheet = document.getElementById('sheet');
  var sheetGrid = document.getElementById('sheetGrid');
  var sheetScroll = document.getElementById('sheetScroll');
  var sheetBtns = null;

  function buildSheet() {
    if (sheetBtns) return;
    var frag = document.createDocumentFragment();
    ART.forEach(function (name, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', 'Quadro ' + (i + 1));
      b.setAttribute('aria-current', 'false');
      var im = document.createElement('img');
      im.src = 'img/thumb/' + name + '.jpg';
      im.alt = '';
      im.loading = 'lazy';
      im.decoding = 'async';
      im.width = TW; im.height = TH[i];
      var tag = document.createElement('b');
      tag.textContent = (i + 1) < 10 ? '0' + (i + 1) : String(i + 1);
      b.appendChild(im); b.appendChild(tag);
      b.addEventListener('click', function () { select(i); closeSheet(); });
      frag.appendChild(b);
    });
    sheetGrid.appendChild(frag);
    sheetBtns = sheetGrid.querySelectorAll('button');
  }

  function openSheet() {
    buildSheet();
    sheetBtns.forEach(function (b, j) { b.setAttribute('aria-current', String(j === current)); });
    sheet.hidden = false;
    document.body.classList.add('sheet-open');
    measureBoxes();
    if (!reduced && !litRaf) litRaf = requestAnimationFrame(litFrame);
    // let it lay out before the class, or the fade has nothing to move from
    setTimeout(function () {

      sheet.classList.add('in');
      var cur = sheetBtns[current];
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
    }, 20);
  }

  function closeSheet() {
    sheet.classList.remove('in');
    setTimeout(function () {
      sheet.hidden = true;
      document.body.classList.remove('sheet-open');
      if (litRaf) { cancelAnimationFrame(litRaf); litRaf = 0; }
    }, 320);
  }

  document.getElementById('allBtn').addEventListener('click', openSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (e.key === 'ArrowRight') select((current + 1) % ART.length);
    else if (e.key === 'ArrowLeft') select((current - 1 + ART.length) % ART.length);
  });

  select(hashArt >= 0 && hashArt < ART.length ? hashArt : 0);
  /* The grid is what you land on: it is the collection, and the viewer is

  if (!/(^|&)one=1/.test(location.hash.replace('#', ''))) setTimeout(openSheet, 120);

  /* ---------------- cursor ----------------

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (e.target.closest && e.target.closest('button, a, .plate')) cur.classList.add('on');
    });
    document.addEventListener('pointerout', function (e) {
      if (e.target.closest && e.target.closest('button, a, .plate')) cur.classList.remove('on');
    });
  }

  /* ---------------- the reel ----------------
     A fixed number of cards ride the ellipse and the items rotate through
     them, so 126 paintings cost thirteen elements rather than 126. Card j
     shows item round(pos) + j - mid, and sits at (j - mid - frac) * step
     around the ring: when pos crosses a whole number the assignment shifts by
     one card and the angle resets by one step, which cancel, so the ring
     turns forever without a seam.

     Loading is held until it settles. Each painting costs a normal map of the
     better part of a second, and spinning past forty of them must not queue
     forty builds. */
  var reel = document.getElementById('reel');
  var SLOTS = 17, MID = 8;
  var CARD_W = 96, CARD_H = 132, MIN_SCALE = 0.34;
  var reelCards = [], pos = 0, posTarget = 0, reelRaf = 0, reelBase = -1;
  var dragging = false, dragY = 0, settleTimer = 0;
  var downY = 0, downId = null, moved = false;

  function wrapIdx(i) { return ((i % ART.length) + ART.length) % ART.length; }

    if (reelCards.length || !reel) return;
    for (var j = 0; j < SLOTS; j++) {

      b.setAttribute('aria-current', 'false');
      var im = document.createElement('img');

         the last button the loop made and each card would pick the same one. */
      b.addEventListener('click', function () {
        if (moved) return;                       // that was a drag, not a pick
        var idx = parseInt(this.dataset.idx, 10);
        if (isNaN(idx)) return;
        spinTo(idx);
        // spinTo only turns the ring; the painting has to be asked for too
        select(idx);
      });

      reelCards.push(b);

  /* Shortest way round, so jumping from 120 to 3 turns six steps and not a
     hundred and seventeen. */
  function spinTo(target) {
    var n = ART.length;
    var d = ((target - wrapIdx(Math.round(posTarget))) % n + n) % n;
    if (d > n / 2) d -= n;
    posTarget = Math.round(posTarget) + d;
    startReel();

  function layoutReel() {
    if (!reelCards.length) return;
    var w = reel.clientWidth, h = reel.clientHeight;
    // below 900px the reel is display:none and both of these are zero, which
    // is also how the layout stops running on a phone
    if (w < 2 || h < 2) return;
    var cw = CARD_W, ch = CARD_H;
    // the ellipse sits on the left edge and bulges right

    var ry = h * 0.40;

    if (base !== reelBase) {

      for (var k = 0; k < SLOTS; k++) {
        var idx = wrapIdx(base + k - MID);
        var card = reelCards[k];
        if (card.dataset.idx !== String(idx)) {
          card.dataset.idx = String(idx);
          card.firstChild.src = 'img/thumb/' + ART[idx] + '.jpg';
          card.setAttribute('aria-label', 'Quadro ' + (idx + 1));
        }

    for (var j = 0; j < SLOTS; j++) {
      var th = (j - MID - frac) * step;
      var c = Math.cos(th), sn = Math.sin(th);
      var sc = MIN_SCALE + (1 - MIN_SCALE) * ((c + 1) / 2);
      var el = reelCards[j];
      el.style.width = cw + 'px';
      el.style.height = ch + 'px';
      var px = c * rx;
      var py = sn * ry;
      el.style.transform =
        'translate(' + (px - cw / 2).toFixed(1) + 'px,' +
        (py - ch / 2).toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      el.style.zIndex = String(Math.round(sc * 1000));
      var t = (c + 1) / 2;
      el.style.opacity = (0.32 + 0.68 * t).toFixed(3);

      el.setAttribute('aria-current', String(Math.abs(th) < step / 2));

      downId = null; dragging = false;
      // let the click through first, then forget it was a drag
      setTimeout(function () { moved = false; }, 0);
    }
    reel.addEventListener('pointerup', endReelDrag);
    reel.addEventListener('pointercancel', endReelDrag);
    reel.addEventListener('wheel', function (e) {
      e.preventDefault();
      posTarget += e.deltaY * 0.004;
      startReel(); settleReel();
    }, { passive: false });
    window.addEventListener('resize', layoutReel);
  }

  /* ---------------- proximity ----------------
     Every painting carries how lit it is, 0 to 1, and the CSS turns that into
     saturation. Light comes from the pointer and from three slow drifts, so
     the grid keeps moving when nobody is touching it.

     Positions are measured once, from offsetLeft/offsetTop against the grid,
     and only adjusted by scrollTop afterwards. Reading getBoundingClientRect
     on 126 elements every frame would force a layout each time. */
  var CURSOR_R = 620;      // how far the hand reaches
  var WAVE_R = 360;        // tighter than the hand, so a wave reads as a thing
                           // travelling over the grid rather than the whole
                           // sheet brightening at once
  var lit = [], boxes = null, litRaf = 0;
  var pmx = -9999, pmy = -9999;

  function measureBoxes() {
    if (!sheetBtns) return;
    boxes = [];
    for (var i = 0; i < sheetBtns.length; i++) {
      var b = sheetBtns[i];
      boxes.push({
        el: b,
        x: b.offsetLeft + b.offsetWidth / 2,
        y: b.offsetTop + b.offsetHeight / 2
      });
      lit[i] = -1;
    }
  }

  /* Smoothstep, not a square. Squared put a card one thumbnail out at half
     lit and two out at a quarter, which is why it read as only the one under
     the hand being lit at all. This holds a broad plateau and then falls
     away. */
  function falloff(d, r) {
    if (d >= r) return 0;
    var t = 1 - d / r;
    return t * t * (3 - 2 * t);
  }

  function litFrame(now) {
    litRaf = requestAnimationFrame(litFrame);
    lastT = now || 0;
    paintLit();
  }

  /* Split out so the pointer can drive it directly. rAF stops in a background
     tab, and the hand should not have to wait on the animation loop. */
  var lastT = 0;
  function paintLit() {
    if (!boxes) return;
    var t = lastT;
    var gr = sheetGrid.getBoundingClientRect();
    var top = gr.top, left = gr.left;
    var W = sheet.clientWidth, H = sheet.clientHeight;

    // three drifts, in the sheet's own coordinates
    var w1x = W * (0.30 + Math.sin(t * 0.00066) * 0.34);
    var w1y = H * (0.34 + Math.cos(t * 0.00048) * 0.34);
    var w2x = W * (0.70 + Math.sin(t * 0.00055 + 2.1) * 0.32);
    var w2y = H * (0.58 + Math.cos(t * 0.00076 + 1.3) * 0.36);
    var w3x = W * (0.48 + Math.sin(t * 0.00043 + 4.2) * 0.40);
    var w3y = H * (0.74 + Math.cos(t * 0.00060 + 0.7) * 0.30);

    for (var i = 0; i < boxes.length; i++) {
      var bx = boxes[i].x + left, by = boxes[i].y + top;
      var v = falloff(Math.hypot(bx - pmx, by - pmy), CURSOR_R);
      var a = falloff(Math.hypot(bx - w1x, by - w1y), WAVE_R) * 1.0;
      if (a > v) v = a;
      a = falloff(Math.hypot(bx - w2x, by - w2y), WAVE_R) * 1.0;
      if (a > v) v = a;
      a = falloff(Math.hypot(bx - w3x, by - w3y), WAVE_R) * 1.0;
      if (a > v) v = a;

      // only write when it actually moved: most of 126 are still each frame
      if (Math.abs(v - lit[i]) > 0.008) {
        lit[i] = v;
        boxes[i].el.style.setProperty('--lit', v.toFixed(3));
      }
    }
  }

  if (fine) {
    sheet.addEventListener('pointermove', function (e) {
      pmx = e.clientX; pmy = e.clientY;
      paintLit();
    }, { passive: true });
    sheet.addEventListener('pointerleave', function () { pmx = pmy = -9999; paintLit(); });
  }
  window.addEventListener('resize', function () { if (boxes) measureBoxes(); });

  /* ---------------- draw ---------------- */
  (function frame() {
    if (ready) {
      lx += (tlx - lx) * 0.12;
      ly += (tly - ly) * 0.12;
      plate.style.transform =
        'rotateY(' + (lx * TILT).toFixed(2) + 'deg) rotateX(' + (-ly * TILT).toFixed(2) + 'deg)';
      gl.uniform3f(U.light, lx, -ly, LIGHT_Z);
      gl.uniform1f(U.relief, RELIEF);
      gl.uniform1f(U.gloss, GLOSS);
      gl.uniform1f(U.spec, SPEC);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
